name: Kryptokrona Testnet Integration Test

# Spins up a 3-node testnet, mines a block and checks the wallet
# (kryptokrona-service) receives the coinbase -- see
# scripts/testnet/ci-integration-test.sh. It builds a TEST_NET=ON binary so
# difficulty is low and the block mines quickly.
#
# Runs on every CI event -- pull requests, master pushes and tags -- so the
# testnet flow is exercised on each CI run, across Linux, macOS and Windows.
# Each job builds its own testnet binaries (separate from the mainnet build
# jobs), so it is self-contained. Windows is experimental (its build is still
# being stabilised and the shell test is not yet validated there).
on:
  push:
    branches:
      - master
      - swap
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# A new push to the same PR/branch cancels in-progress runs so slow testnet
# builds don't pile up.
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testnet-integration:
    name: "Testnet integration / ${{ matrix.config.name }}"
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.config.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Ubuntu 22.04", os: ubuntu-22.04 }
          - { name: "macOS arm64", os: macos-14 }
          - { name: "Windows x64", os: windows-2022, experimental: true }
    steps:
      - uses: actions/checkout@v4

      # ---------------- Dependencies ----------------
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-dev libboost-all-dev libssl-dev libffi-dev python3-dev gcc g++ git cmake librocksdb-dev curl \
            libboost-system1.74.0 libboost-filesystem1.74.0 libboost-thread1.74.0 libboost-date-time1.74.0 libboost-chrono1.74.0 libboost-regex1.74.0 libboost-serialization1.74.0 libboost-program-options1.74.0 libicu70

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install boost cmake ccache

      # Restore the vcpkg binary cache so Boost is built from source only once;
      # later runs restore the prebuilt packages and skip the ~30 github.com
      # downloads entirely (which is what trips the HTTP 429s). run_id in the key
      # + prefix restore-keys makes it a rolling cache that always saves the
      # latest snapshot and restores the most recent prior one.
      - name: Cache vcpkg Boost binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_bincache
          key: vcpkg-x64-windows-static-${{ github.run_id }}
          restore-keys: |
            vcpkg-x64-windows-static-

      - name: Install Boost (Windows, vcpkg static)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Boost source tarballs are fetched from github.com, which
          # intermittently rate-limits (HTTP 429) or 502s and fails the whole
          # install. Retry with backoff -- vcpkg is idempotent and resumes from
          # what it already downloaded/built.
          #
          # Point vcpkg at the binary cache restored by the actions/cache step
          # above: on a warm cache it restores the prebuilt Boost and skips the
          # github.com downloads AND the compile, so only the first cold run pays
          # the download cost -- which the retry loop makes reliable.
          $env:VCPKG_DEFAULT_BINARY_CACHE = "${{ github.workspace }}\vcpkg_bincache"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $modules = @(
            'boost-system','boost-filesystem','boost-thread','boost-date-time',
            'boost-chrono','boost-serialization','boost-program-options',
            'boost-multi-index','boost-uuid','boost-variant','boost-optional',
            'boost-utility','boost-functional','boost-scope-exit','boost-foreach',
            'boost-algorithm','boost-range','boost-lexical-cast','boost-iterator',
            'boost-format'
          )
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install --triplet x64-windows-static @modules
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after 5 attempts (exit $LASTEXITCODE)" }
            $wait = 30 * $attempt
            Write-Host "::warning::vcpkg boost install failed (attempt $attempt/5); retrying in $wait s"
            Start-Sleep -Seconds $wait
          }

      # ---------------- Build (TEST_NET=ON) ----------------
      - name: Build testnet binaries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build && cd build
          cmake -DTEST_NET=ON -DBoost_ARCHITECTURE=-x64 ..
          make -j$(nproc)

      - name: Build testnet binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build && cd build
          cmake -DTEST_NET=ON ..
          make -j$(sysctl -n hw.ncpu)

      - name: Build testnet binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DTEST_NET=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ..
          cmake --build . --config Release -- /m

      # ---------------- Run the integration test ----------------
      - name: Run testnet integration test (Unix)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          chmod +x scripts/testnet/ci-integration-test.sh
          BIN_DIR=build/src ./scripts/testnet/ci-integration-test.sh

      # Full API-surface test: exercises every daemon / kryptokrona-service /
      # wallet-api endpoint plus 100+ wallets. Requires jq + curl (preinstalled
      # on the GitHub Ubuntu/macOS runners).
      - name: Run API endpoint test (Unix)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          chmod +x scripts/testnet/api-endpoint-test.sh
          BIN_DIR=build/src ./scripts/testnet/api-endpoint-test.sh

      # The money-flow smoke test: 3 peered nodes, a wallet on each (both the
      # kryptokrona-service and wallet-api backends), mine to one and send real
      # funds between them across the p2p network, asserting exact receipt +
      # persistence. Linux-only for now: it runs ~7 processes (3 nodes + 3
      # wallets + miner) and the resource-constrained macOS runner is prone to
      # timing flakiness under that load. To also cover macOS, add
      # "|| runner.os == 'macOS'" once its reliability is confirmed.
      - name: Run wallet flow test (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/testnet/wallet-flow-test.sh
          BIN_DIR=build/src ./scripts/testnet/wallet-flow-test.sh

      - name: Run testnet integration test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN_DIR=build/src/Release ./scripts/testnet/ci-integration-test.sh

  # XKR atomic-swap integration: proves the BTC<->XKR swap engine's XKR side
  # against a live testnet. Two tiers:
  #   * swap-rpc-service-test.sh  -- the JS wallet RPC service (xkr-wallet-rpc.cjs
  #     from kryptokrona/yggdrasil-wallet) driven directly.
  #   * swap-engine-e2e-test.sh   -- the Rust engine's own XkrWallet adapter
  #     (kryptokrona/xkr-swap-core) driven against that service.
  # Linux-only: both spin up a peered 3-node mesh plus Node + a Rust build.
  xkr-swap-integration:
    name: "XKR swap integration (Linux)"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout kryptokrona
        uses: actions/checkout@v4

      - name: Checkout aesir-wallet (XKR wallet RPC service)
        uses: actions/checkout@v4
        with:
          repository: kryptokrona/aesir-wallet
          ref: swap
          path: yggdrasil-wallet

      - name: Checkout xkr-swap-core (swap engine)
        uses: actions/checkout@v4
        with:
          repository: kryptokrona/xkr-swap-core
          ref: kryptokrona-port
          path: xkr-swap-core

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libboost-dev libboost-all-dev libssl-dev libffi-dev python3-dev gcc g++ git cmake librocksdb-dev curl jq \
            libboost-system1.74.0 libboost-filesystem1.74.0 libboost-thread1.74.0 libboost-date-time1.74.0 libboost-chrono1.74.0 libboost-regex1.74.0 libboost-serialization1.74.0 libboost-program-options1.74.0 libicu70

      - name: Build kryptokrona testnet binaries
        run: |
          mkdir -p build && cd build
          cmake -DTEST_NET=ON -DBoost_ARCHITECTURE=-x64 ..
          make -j$(nproc)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Only the pure-JS kryptokrona-wallet-backend-js + kryptokrona-utils are
      # needed by the service; --ignore-scripts skips the wallet app's native
      # build steps so CI doesn't depend on them.
      # The xkr-wallet-rpc.cjs service needs only two published packages
      # (kryptokrona-wallet-backend-js + kryptokrona-utils). Do NOT run the wallet
      # app's own `npm ci` here: its committed lockfile links backend-js from a
      # local sibling path that doesn't exist in CI (-> "Cannot find module"), and
      # its full Svelte/Electron tree has peer + engine-strict conflicts. Install
      # just the two deps in isolation and expose them via NODE_PATH (exported for
      # all later steps, which is how the scripts' `node` picks them up).
      - name: Install XKR wallet RPC service deps (isolated)
        run: |
          mkdir -p "$RUNNER_TEMP/xkrsvc" && cd "$RUNNER_TEMP/xkrsvc"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            kryptokrona-wallet-backend-js@^2.6.0 kryptokrona-utils@^1.4.0
          echo "NODE_PATH=$RUNNER_TEMP/xkrsvc/node_modules" >> "$GITHUB_ENV"

      # The engine is XKR-only now: no monero-sys / C++ Monero build, so this is a
      # plain (cached) Rust build. rust-toolchain.toml pins the compiler.
      - name: Cache Rust build (xkr-swap-core)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xkr-swap-core

      - name: Build XKR engine examples
        working-directory: xkr-swap-core
        run: |
          cargo build -p swap --example xkr_adapter_e2e
          cargo build -p swap --example xkr_two_party_swap

      - name: Run XKR wallet RPC service test
        run: |
          chmod +x scripts/testnet/swap-rpc-service-test.sh
          BIN_DIR=build/src \
          XKR_RPC_SERVICE="$GITHUB_WORKSPACE/yggdrasil-wallet/src/backend/swap/xkr-wallet-rpc.cjs" \
          ./scripts/testnet/swap-rpc-service-test.sh

      - name: Run XKR engine <-> service e2e test
        run: |
          chmod +x scripts/testnet/swap-engine-e2e-test.sh
          BIN_DIR=build/src \
          XKR_RPC_SERVICE="$GITHUB_WORKSPACE/yggdrasil-wallet/src/backend/swap/xkr-wallet-rpc.cjs" \
          EXAMPLE_BIN="$GITHUB_WORKSPACE/xkr-swap-core/target/debug/examples/xkr_adapter_e2e" \
          ./scripts/testnet/swap-engine-e2e-test.sh

      # Level 3: a full two-party BTC<->XKR swap. Alice + Bob run in-process
      # (xkr_two_party_swap) against the XKR mesh above plus a regtest bitcoind +
      # esplora electrs (Docker, preinstalled on the Ubuntu runner). This is the
      # only test that exercises the whole cross-chain choreography end to end.
      - name: Run two-party BTC<->XKR swap test
        run: |
          chmod +x scripts/testnet/swap-two-party-test.sh
          BIN_DIR=build/src \
          XKR_RPC_SERVICE="$GITHUB_WORKSPACE/yggdrasil-wallet/src/backend/swap/xkr-wallet-rpc.cjs" \
          EXAMPLE_BIN="$GITHUB_WORKSPACE/xkr-swap-core/target/debug/examples/xkr_two_party_swap" \
          ./scripts/testnet/swap-two-party-test.sh
